services:
  game-stats:
    build:
      context: .
      args:
        # true en production (AUTH_ENABLED=true) pour installer auth-client
        WITH_AUTH: ${WITH_AUTH:-false}
    container_name: game-stats
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    networks:
      - web

networks:
  # Même réseau partagé que game-hub, le reverse proxy et le service d'auth.
  # À créer une seule fois (déjà fait pour game-hub) : docker network create web
  web:
    external: true
