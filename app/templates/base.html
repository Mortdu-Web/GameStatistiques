<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Statistiques – Game Hub{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&display=swap">
  <link rel="stylesheet" href="{{ url_for('statistiques.static', filename='css/site.css') }}">
  {% block styles %}{% endblock %}
  {% block head_scripts %}{% endblock %}
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('statistiques.page') }}">📊 Statistiques</a>
    {% if hub_url %}
    <a class="topbar-link" href="{{ hub_url }}">Retour au Game Hub</a>
    {% endif %}
  </header>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
